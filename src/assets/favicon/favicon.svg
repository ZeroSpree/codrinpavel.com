<svg viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    :root { color-scheme: light dark; }
      .favicon__txt { fill: #f6f2ef; }
      .favicon__bg { fill: #2d312a; }

    @media (prefers-color-scheme: dark) {
      .favicon__txt { fill: #2d312a; }
      .favicon__bg { fill: #f6f2ef; }
    }
  </style>
  <rect class="favicon__bg" width="100%" height="100%" rx="100" />
</svg>